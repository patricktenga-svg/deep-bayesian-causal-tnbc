version: "3.9"

services:
  api:
    build: .
    container_name: dbci-api
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
      - CONFIG_PATH=/app/configs/config.yaml
      - MODEL_PATH=/app/checkpoints/best_model.pt
    volumes:
      - ./checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    container_name: dbci-app
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/api/v1
    depends_on:
      - api