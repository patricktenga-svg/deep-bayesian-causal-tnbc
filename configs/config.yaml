project:
  name: "dbci-tnbc"
  seed: 42
  device: "auto"

data:
  num_samples: 500
  imaging_channels: 1
  imaging_size: 224
  microbial_dim: 500
  transcriptomic_dim: 1000
  batch_size: 32
  test_size: 0.2
  num_workers: 0

model:
  latent_dim: 128
  hidden_dim: 256
  dropout: 0.1
  num_mc_samples: 100
  vit:
    patch_size: 16
    hidden_dim: 768
    num_heads: 12
    num_layers: 8

training:
  epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  vae_weight: 0.1
  grad_clip: 1.0
  checkpoint_dir: "checkpoints"
  log_dir: "logs"